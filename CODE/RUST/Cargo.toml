[package]
name = "senselogic_gson"
version = "0.4.0"
edition = "2021"

[dependencies]
base64 = "0.22"
hex = "0.4"
md5 = "0.7"
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[[bin]]
name = "test"
path = "src/bin/test.rs"
